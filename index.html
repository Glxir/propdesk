<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prop Desk</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prop Desk">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E13;--s1:#141922;--s2:#0F141B;--line:#1E2633;--line2:#263042;--tx:#E7ECF3;--tx2:#C9D3E1;--mut:#9AA6B8;
--ac:#2DD4BF;--ac2:#5EEAD4;--acbg:#10261F;--red:#FCA5A5;--redbg:#2A1414;--amb:#FCD34D;--ambbg:#2A2414;--blu:#93C5FD;--blubg:#14203A;
--mono:'IBM Plex Mono',ui-monospace,monospace;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 18px) 16px 24px;display:flex;flex-direction:column;gap:16px;max-width:560px;width:100%;margin:0 auto}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--s1);border:1px solid #232C3B;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:3px;min-width:0}
.mut{color:var(--mut);font-size:12px}
.sm{font-size:13px;color:var(--tx2)}
.mono{font-family:var(--mono)}
.big{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em}
.pos{color:var(--ac2)}.neg{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--acbg);color:var(--ac2)}.pill.bad{background:var(--redbg);color:var(--red)}.pill.warn{background:var(--ambbg);color:var(--amb)}.pill.info{background:var(--blubg);color:var(--blu)}.pill.off{background:#1A202B;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
.tag{flex:0 0 auto;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700}
.acct{background:var(--s1);border:1px solid #232C3B;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.acct:active{background:#18202B}
.bar{height:6px;border-radius:99px;background:#222B39;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:var(--ac)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--s2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--mono);font-size:16px;font-weight:600}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--s1);font-size:15px;font-weight:600;padding:0 16px;width:100%}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#04201C}
.btn.danger{background:var(--redbg);border-color:#4A2020;color:var(--red)}
.btn:disabled{opacity:.5}
.ibtn{min-width:40px;min-height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--s2);display:inline-flex;align-items:center;justify-content:center}
.tog{flex:0 0 auto;width:50px;height:30px;border-radius:999px;border:0;padding:3px;display:flex;background:#3A4558;transition:background .15s}
.tog i{width:24px;height:24px;border-radius:50%;background:#fff;display:block;transition:transform .15s}
.tog[aria-pressed=true]{background:#14B8A6}.tog[aria-pressed=true] i{transform:translateX(20px)}
.tog.pending{opacity:.6}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:8px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line2);background:var(--s1);color:var(--tx2)}
.chip[aria-pressed=true]{border-color:var(--ac);background:var(--acbg);color:var(--ac2)}
.step{display:flex;align-items:center;gap:6px}.step span{min-width:34px;text-align:center;font-family:var(--mono);font-weight:600}
.feed{display:flex;flex-direction:column}
.ev{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev .t{font-family:var(--mono);font-size:12px;color:var(--mut);width:44px;flex:0 0 auto;padding-top:2px}
.ev .b{white-space:pre-line;font-size:13px;color:var(--tx2);overflow-wrap:anywhere}
.banner{border-radius:14px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.bad{background:var(--redbg);color:var(--red)}.banner.warn{background:var(--ambbg);color:var(--amb)}.banner.info{background:var(--blubg);color:var(--blu)}
input,textarea{width:100%;background:var(--s2);border:1px solid var(--line2);border-radius:12px;color:var(--tx);font:inherit;font-size:16px;padding:12px}
textarea{font-family:var(--mono);font-size:13px;min-height:90px;resize:vertical}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:32px 12px;font-size:14px}
a{color:#7CC4FF;text-decoration:none}
nav{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:#0E1219;padding:6px 4px calc(var(--sab) + 6px)}
nav a{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:48px;justify-content:center;color:var(--mut);font-size:11px;position:relative}
nav a[aria-current=page]{color:var(--ac2);font-weight:600}
nav a .badge{position:absolute;top:4px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--red)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--s1);border-radius:20px 20px 0 0;padding:20px 16px calc(var(--sab) + 16px);width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--sab) + 84px);margin:0 auto;max-width:520px;background:#222B39;border:1px solid var(--line2);border-radius:14px;padding:12px 14px;font-size:14px;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"><main id="view"></main><nav id="nav" aria-label="Main"></nav></div>
<div id="layer"></div>
<script>
'use strict';
// ------------------------------------------------------------------ config + storage
const LS = {
  get(k, d) { try { const v = localStorage.getItem('pd.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pd.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('pd.' + k); } catch (e) {} }
};
let cfg = LS.get('cfg', null);          // {server, alerts, status, cmd, pin, demo}
let status = LS.get('status', null);    // last hub status JSON
let statusAt = LS.get('statusAt', 0);   // ms when the hub posted it
let alerts = LS.get('alerts', []);      // [{id,time,title,message,tags,priority}]
let seenAlert = LS.get('seenAlert', 0);
let alertFilter = 'All';
let pending = {};                       // optimistic UI: key -> value
let loading = false, lastErr = '';

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (v, sign) => v == null || isNaN(v) ? '—' : (sign ? (v > 0 ? '+' : v < 0 ? '−' : '') : (v < 0 ? '−' : '')) + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = (v) => v == null || isNaN(v) ? '—' : (v < 0 ? '−' : '') + '$' + Math.abs(v).toLocaleString('en-US', { maximumFractionDigits: 0 });
const cls = (v) => v > 0 ? 'pos' : v < 0 ? 'neg' : '';
const nyFmt = (opts) => new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: 'America/New_York' }, opts));
const tHM = nyFmt({ hour: 'numeric', minute: '2-digit', hour12: false });
const tDay = nyFmt({ weekday: 'short', month: 'short', day: 'numeric' });
const ago = (ms) => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? s + ' s ago' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
const base = () => (cfg.server || 'https://ntfy.sh').replace(/\/+$/, '');
const shortName = (n) => n && n.length > 18 ? n.slice(0, 7) + '…' + n.slice(-6) : n;

// ------------------------------------------------------------------ demo data
function demoStatus() {
  return { v: 1, time: new Date(Date.now() - 40000).toISOString(), copying: true, leader: 'LUCID-PRO-25K-1',
    followers: [{ name: 'LUCID-PRO-25K-2', mult: 1, enabled: true, connected: true }, { name: 'APEX-50K-1', mult: 2, enabled: true, connected: true }, { name: 'TOPSTEP-50K', mult: 1, enabled: false, connected: false }],
    accounts: [
      { name: 'LUCID-PRO-25K-1', leader: true, connection: 'Lucid', balance: 25136, today: 294.5, open: 0, floor: 24295, room: 841, minRoom: 200, warn: 300, dd: 1000, positions: [], strategies: [{ name: 'NoiseAreaMomentum', state: 'Realtime', inst: 'MNQ 12-26 Globex' }] },
      { name: 'LUCID-PRO-25K-2', leader: false, connection: 'Lucid', balance: 25412.5, today: 290.0, open: 0, floor: 24412.5, room: 1000, minRoom: 200, warn: 300, dd: 1000, positions: [], strategies: [] },
      { name: 'APEX-50K-1', leader: false, connection: 'Apex', balance: 50890, today: 582, open: 0, floor: 48390, room: 2500, minRoom: 200, warn: 300, dd: 2500, positions: [], strategies: [] }
    ] };
}
function demoAlerts() {
  const t = (h, m) => { const d = new Date(); d.setHours(h, m, 0, 0); return Math.floor(d.getTime() / 1000); };
  return [
    { id: 'd5', time: t(12, 2), title: 'Leader FLAT · MNQ', message: 'Target filled 25,918.25 (Profit target)', tags: ['checkered_flag'] },
    { id: 'd4', time: t(12, 2), title: 'Copied to 2 account(s)', message: 'LUCID-PRO-25K-2: Sell 1 @ 25,918.25\nAPEX-50K-1: Sell 2 @ 25,918.00', tags: ['white_check_mark'] },
    { id: 'd3', time: t(10, 55), title: 'Copied to 2 account(s)', message: 'LUCID-PRO-25K-2: Buy 1 @ 25,768.50\nAPEX-50K-1: Buy 2 @ 25,768.75', tags: ['white_check_mark'] },
    { id: 'd2', time: t(10, 55), title: 'Leader LONG 1 · MNQ', message: 'Buy 1 @ 25,768.25 (NAM Long)', tags: ['chart_with_upwards_trend'] },
    { id: 'd1', time: t(9, 20), title: 'Hub ready', message: 'Copying ON · 3 accounts connected', tags: ['sunrise'] }
  ];
}

// ------------------------------------------------------------------ ntfy I/O
async function ntfyPoll(topic, since) {
  const r = await fetch(base() + '/' + encodeURIComponent(topic) + '/json?poll=1&since=' + encodeURIComponent(since), { cache: 'no-store' });
  if (!r.ok) throw new Error('ntfy ' + r.status);
  const txt = await r.text();
  return txt.split('\n').filter(Boolean).map((l) => { try { return JSON.parse(l); } catch (e) { return null; } }).filter((m) => m && m.event === 'message');
}
async function messageBody(m) {
  if (m.attachment && m.attachment.url) { const r = await fetch(m.attachment.url, { cache: 'no-store' }); return await r.text(); }
  return m.message;
}
async function refresh(quiet) {
  if (!cfg) return;
  if (cfg.demo) { status = demoStatus(); statusAt = Date.now() - 40000; if (!alerts.length) alerts = demoAlerts(); render(); return; }
  if (loading) return;
  loading = true; if (!quiet) render();
  try {
    let msgs = await ntfyPoll(cfg.status, 'latest');
    if (!msgs.length) msgs = await ntfyPoll(cfg.status, '12h');
    if (msgs.length) {
      const m = msgs[msgs.length - 1];
      const s = JSON.parse(await messageBody(m));
      status = s; statusAt = (m.time || 0) * 1000;
      LS.set('status', status); LS.set('statusAt', statusAt);
      pending = {};
    }
    const lastId = alerts.length ? alerts[0].id : null;
    const fresh = await ntfyPoll(cfg.alerts, lastId || '12h');
    if (fresh.length) {
      const known = new Set(alerts.map((a) => a.id));
      const add = fresh.filter((m) => !known.has(m.id)).map((m) => ({ id: m.id, time: m.time, title: m.title || '', message: m.message || '', tags: m.tags || [], priority: m.priority || 3 }));
      alerts = add.reverse().concat(alerts).sort((a, b) => b.time - a.time).slice(0, 400);
      LS.set('alerts', alerts);
    }
    lastErr = '';
  } catch (e) { lastErr = navigator.onLine === false ? 'You are offline.' : 'Could not reach ntfy (' + e.message + ').'; }
  loading = false; render();
}
async function send(cmd, okMsg) {
  if (cfg.demo) { toast('Demo mode: "' + cmd + '" would be sent to your hub.'); return true; }
  try {
    const r = await fetch(base() + '/' + encodeURIComponent(cfg.cmd), { method: 'POST', body: cfg.pin + ' ' + cmd });
    if (!r.ok) throw new Error('ntfy ' + r.status);
    toast(okMsg || 'Sent. The hub picks it up within 10 seconds.');
    setTimeout(() => refresh(true), 14000); setTimeout(() => refresh(true), 30000);
    return true;
  } catch (e) { toast('Not sent: ' + e.message); return false; }
}
async function testPush() {
  if (cfg.demo) { toast('Demo mode: set up your hub first.'); return; }
  try {
    const r = await fetch(base() + '/' + encodeURIComponent(cfg.alerts), { method: 'POST', headers: { Title: 'Prop Desk test', Tags: 'bell' }, body: 'If you see this on your lock screen, push alerts work.' });
    toast(r.ok ? 'Test sent. It should pop up through the ntfy app.' : 'Failed: ' + r.status);
  } catch (e) { toast('Failed: ' + e.message); }
}

// ------------------------------------------------------------------ derived state
function hubHealth() {
  if (!status) return { k: 'off', label: 'No data yet' };
  const ny = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const hm = ny.getHours() * 100 + ny.getMinutes(), wk = ny.getDay() > 0 && ny.getDay() < 6;
  const limit = (wk && hm >= 905 && hm <= 1700 ? 12 : 75) * 60000;
  const age = Date.now() - statusAt;
  return age <= limit ? { k: 'ok', label: 'Online' } : { k: 'bad', label: 'Offline' };
}
const accounts = () => (status && status.accounts) || [];
const followerOf = (name) => ((status && status.followers) || []).find((f) => f.name.toLowerCase() === String(name).toLowerCase());
function roomInfo(a) {
  if (a.room == null) return { k: 'off', pct: null };
  const k = a.room < (a.minRoom || 200) ? 'bad' : a.room < (a.warn || 300) ? 'warn' : 'ok';
  const pct = a.dd > 0 ? Math.max(0, Math.min(100, a.room / a.dd * 100)) : null;
  return { k, pct };
}
function alertKind(a) {
  const t = a.tags || [];
  if (t.includes('chart_with_upwards_trend') || t.includes('checkered_flag')) return 'Trade';
  if (t.includes('white_check_mark')) return 'Fill';
  if (['warning', 'no_entry', 'rotating_light', 'octagonal_sign', 'x'].some((x) => t.includes(x)) || /REJECTED|skipped|limit/i.test(a.title)) return 'Risk';
  return 'Hub';
}
const KIND = { Trade: ['var(--blubg)', 'var(--blu)'], Fill: ['var(--acbg)', 'var(--ac2)'], Risk: ['var(--ambbg)', 'var(--amb)'], Hub: ['#1A202B', 'var(--mut)'] };

// ------------------------------------------------------------------ UI helpers
const ICON = {
  acc: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18"/>',
  str: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  hub: '<rect x="2" y="4" width="20" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/>',
  ref: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  chev: '<path d="M9 18l6-6-6-6"/>'
};
const svg = (k, sz = 22, extra = '') => '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ' + extra + '>' + ICON[k] + '</svg>';
const pill = (k, label) => '<span class="pill ' + k + '"><span class="dot"></span>' + esc(label) + '</span>';
const tog = (on, act, label, pend) => '<button class="tog' + (pend ? ' pending' : '') + '" aria-label="' + esc(label) + '" aria-pressed="' + (on ? 'true' : 'false') + '" data-act="' + esc(act) + '"><i></i></button>';
const refreshBtn = () => '<button class="ibtn" data-act="refresh" aria-label="Refresh">' + svg('ref', 20, loading ? 'class="spin"' : '') + '</button>';
function header(title, back) {
  return '<div class="top">' + (back ? '<a class="ibtn" href="' + back + '" aria-label="Back">' + svg('back', 20) + '</a>' : '') +
    '<h1 style="flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(title) + '</h1>' + refreshBtn() + '</div>';
}
function hubBanner() {
  let h = '';
  if (cfg && cfg.demo) h += '<div class="banner info">Demo data. Open the Hub tab to connect your own hub.</div>';
  if (lastErr) h += '<div class="banner warn">' + esc(lastErr) + '</div>';
  const hh = hubHealth();
  if (!cfg.demo && status && hh.k === 'bad') h += '<div class="banner bad">The hub has not checked in since ' + esc(ago(statusAt)) + '. Copying and alerts are not running. Check the mini PC and NinjaTrader.</div>';
  if (!cfg.demo && !status && !loading) h += '<div class="banner info">Waiting for the first status from your hub. Make sure NinjaTrader is running with PropDeskHub installed.</div>';
  return h;
}
let toastT;
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
  document.querySelectorAll('.toast').forEach((t) => t.remove()); document.body.appendChild(el);
  clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3800);
}
function sheet(title, body, okLabel, danger, onOk) {
  const L = $('#layer');
  L.innerHTML = '<div class="sheet-bg" data-act="sheet-close"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
    '<div style="font-size:18px;font-weight:700">' + esc(title) + '</div><div class="sm" style="line-height:1.5">' + body + '</div>' +
    '<button class="btn ' + (danger ? 'danger' : 'pri') + '" id="sheet-ok">' + esc(okLabel) + '</button><button class="btn" data-act="sheet-close">Cancel</button></div></div>';
  $('#sheet-ok').onclick = () => { L.innerHTML = ''; onOk(); };
}

// ------------------------------------------------------------------ screens
function vAccounts() {
  const A = accounts();
  const tot = A.reduce((s, a) => s + (a.today || 0) + (a.open || 0), 0);
  const hh = hubHealth();
  let h = header('Accounts') + hubBanner();
  if (status) {
    h += '<div class="card"><div class="row"><span class="mut">Today across ' + A.length + ' account' + (A.length === 1 ? '' : 's') + '</span>' + pill(hh.k, hh.label) + '</div>' +
      '<div class="big ' + cls(tot) + '">' + money(tot, true) + '</div>' +
      '<div class="row"><span class="sm">Copying ' + (status.copying ? '<b class="pos">ON</b>' : '<b class="neg">PAUSED</b>') + '</span><span class="mut">Updated ' + esc(ago(statusAt)) + '</span></div></div>';
  }
  if (!A.length && status) h += '<div class="empty">No accounts in the hub settings yet. Add your leader and followers in PropDesk.xml on the hub.</div>';
  A.forEach((a) => {
    const r = roomInfo(a), f = followerOf(a.name);
    const role = a.leader ? pill('info', 'Leader') : f ? (f.enabled ? pill('ok', 'Copying ×' + f.mult) : pill('off', 'Not copying')) : '';
    const posTxt = (a.positions || []).map((p) => (p.qty > 0 ? 'Long ' : 'Short ') + Math.abs(p.qty) + ' ' + p.inst + ' @ ' + p.avg.toLocaleString('en-US', { minimumFractionDigits: 2 })).join(' · ');
    h += '<button class="acct" data-go="#account/' + encodeURIComponent(a.name) + '">' +
      '<div class="row"><div class="col"><span style="font-weight:600;font-size:15px">' + esc(shortName(a.name)) + '</span><span class="mut">' + esc(a.connection || '') + '</span></div>' + role + '</div>' +
